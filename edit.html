<!DOCTYPE html>
<html lang="id">
<head>
  <script src="https://cdn.jsdelivr.net/npm/eruda"></script>
  <script> eruda.init(); console.log("Eruda Siap!"); </script>
  
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Edit Transaksi</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --pink-main: #EC4899; --pink-dark: #BE185D; --pink-light: #FDF2F8;
    --gold: #D4AF37; --bg-main: #FFFFFF; --text-main: #1F2937; --text-muted: #6B7280;
    --green: #10B981; --red: #EF4444;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Inter', sans-serif; background: var(--pink-light); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 16px; }
  .phone { width: 100%; max-width: 420px; height: 90vh; max-height: 800px; background: var(--bg-main); border-radius: 32px; overflow: hidden; box-shadow: 0 25px 60px -12px rgba(236, 72, 153, 0.25); display: flex; flex-direction: column; position: relative; }
  .app-header { background: linear-gradient(135deg, var(--pink-main) 0%, var(--pink-dark) 100%); padding: 20px; color: white; border-bottom-left-radius: 24px; border-bottom-right-radius: 24px; box-shadow: 0 4px 15px rgba(236, 72, 153, 0.3); z-index: 10; display: flex; align-items: center; gap: 12px; }
  .back-btn { background: rgba(255,255,255,0.2); border: none; color: white; width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 18px; cursor: pointer; text-decoration: none; transition: 0.2s; }
  .app-title { font-size: 16px; font-weight: 600; }
  .content { flex: 1; padding: 24px 20px; overflow-y: auto; background: var(--pink-light); }
  .form-group { margin-bottom: 20px; }
  .form-label { display: block; font-size: 13px; font-weight: 600; color: var(--text-main); margin-bottom: 8px; }
  .form-control { width: 100%; padding: 14px; border-radius: 12px; border: 1.5px solid #E5E7EB; font-family: inherit; font-size: 14px; color: var(--text-main); background: white; transition: border-color 0.2s; }
  .form-control:focus { outline: none; border-color: var(--pink-main); box-shadow: 0 0 0 3px rgba(236, 72, 153, 0.1); }
  
  .type-selector { display: flex; gap: 12px; }
  .type-option { flex: 1; position: relative; cursor: pointer; }
  .type-option input { position: absolute; opacity: 0; }
  .type-box { display: flex; align-items: center; justify-content: center; gap: 8px; padding: 14px; border-radius: 12px; border: 1.5px solid #E5E7EB; background: white; font-size: 13px; font-weight: 600; color: var(--text-muted); transition: all 0.2s; }
  .type-option input[value="income"]:checked ~ .type-box { border-color: var(--green); background: #D1FAE5; color: var(--green); }
  .type-option input[value="expense"]:checked ~ .type-box { border-color: var(--pink-dark); background: #FCE7F3; color: var(--pink-dark); }

  .btn-save { width: 100%; padding: 16px; border-radius: 12px; border: none; background: linear-gradient(135deg, var(--pink-main) 0%, var(--pink-dark) 100%); color: white; font-family: inherit; font-size: 15px; font-weight: 700; cursor: pointer; box-shadow: 0 4px 15px rgba(236, 72, 153, 0.3); transition: transform 0.2s; margin-top: 10px; }
  .btn-save:active { transform: scale(0.98); }
  .btn-save:disabled { opacity: 0.7; cursor: not-allowed; }
  
  .loading { text-align: center; padding: 20px; font-size: 14px; color: var(--text-muted); }
</style>
</head>
<body>

<div class="phone">
  <div class="app-header">
    <a href="index.html" class="back-btn">←</a>
    <div class="app-title">Edit Transaksi</div>
  </div>

  <div class="content" id="formContent">
    <div class="loading">Memuat data transaksi...</div>
    <form id="editForm" style="display: none;">
      <div class="form-group">
        <label class="form-label">Jenis Transaksi</label>
        <div class="type-selector">
          <label class="type-option">
            <input type="radio" name="type" value="income" required>
            <div class="type-box">⬇️ Pemasukan</div>
          </label>
          <label class="type-option">
            <input type="radio" name="type" value="expense" required>
            <div class="type-box">⬆️ Pengeluaran</div>
          </label>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">Nominal (Rp)</label>
        <input type="number" id="amount" class="form-control" placeholder="Contoh: 50000" required min="1">
      </div>

      <div class="form-group">
        <label class="form-label">Keterangan</label>
        <input type="text" id="note" class="form-control" placeholder="Contoh: Beli makan siang" required>
      </div>

      <button type="submit" class="btn-save" id="btnSubmit">Update Transaksi</button>
    </form>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
  import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
  import { getFirestore, doc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCk4qgZ5Gu2ZHZ6et0T2MG0-5puy6g10mE",
    authDomain: "keuangan-488ad.firebaseapp.com",
    projectId: "keuangan-488ad",
    storageBucket: "keuangan-488ad.firebasestorage.app",
    messagingSenderId: "229611696652",
    appId: "1:229611696652:web:05b25a6850869de7c93429"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  const form = document.getElementById('editForm');
  const btnSubmit = document.getElementById('btnSubmit');
  const loadingText = document.querySelector('.loading');
  
  // Ambil ID dari URL (misal: edit.html?id=XYZ)
  const urlParams = new URLSearchParams(window.location.search);
  const trxId = urlParams.get('id');
  let currentUser = null;

  if (!trxId) {
    alert("ID Transaksi tidak ditemukan!");
    window.location.href = 'index.html';
  }

  onAuthStateChanged(auth, async (user) => {
    if (user) {
      currentUser = user;
      loadDataTransaksi(trxId);
    } else {
      window.location.href = 'login.html';
    }
  });

  async function loadDataTransaksi(id) {
    try {
      const docRef = doc(db, "pembukuan", id);
      const docSnap = await getDoc(docRef);

      if (docSnap.exists()) {
        const data = docSnap.data();
        
        // Isi form dengan data lama
        document.querySelector(`input[name="type"][value="${data.type}"]`).checked = true;
        document.getElementById('amount').value = data.amount;
        document.getElementById('note').value = data.note;

        loadingText.style.display = 'none';
        form.style.display = 'block';
      } else {
        alert("Data transaksi tidak ditemukan di database.");
        window.location.href = 'index.html';
      }
    } catch (error) {
      console.error("Gagal load: ", error);
      alert("Gagal memuat data. Cek Eruda.");
    }
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    btnSubmit.disabled = true;
    btnSubmit.innerText = "Mengupdate...";

    const type = document.querySelector('input[name="type"]:checked').value;
    const amount = Number(document.getElementById('amount').value);
    const note = document.getElementById('note').value;

    try {
      // Update data di Firestore
      const docRef = doc(db, "pembukuan", trxId);
      await updateDoc(docRef, {
        type: type,
        amount: amount,
        note: note
        // createdAt tidak diubah agar urutan waktu tetap di posisi semula
      });

      // Kembali ke halaman utama
      window.location.href = 'index.html';

    } catch (error) {
      console.error("Gagal update: ", error);
      alert("Gagal mengupdate data. Cek Eruda.");
      btnSubmit.disabled = false;
      btnSubmit.innerText = "Update Transaksi";
    }
  });
</script>
</body>
</html>
