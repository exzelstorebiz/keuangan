<!DOCTYPE html>
<html lang="id">
<head>
  <script src="https://cdn.jsdelivr.net/npm/eruda"></script>
  <script> eruda.init(); console.log("Eruda Siap!"); </script>
  
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Input Transaksi - Keuangan Keluarga</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --pink-main: #EC4899; --pink-dark: #BE185D; --pink-light: #FDF2F8;
    --gold: #D4AF37; --gold-light: #FDE68A;
    --bg-main: #FFFFFF; --text-main: #1F2937; --text-muted: #6B7280;
    --green: #10B981; --red: #EF4444;
    --bg-card: #FFFFFF;
  }

  /* TEMA GELAP (DARK MODE) */
  body.dark-mode {
    --bg-main: #1F2937; 
    --bg-app: #111827; 
    --text-main: #F9FAFB; 
    --text-muted: #9CA3AF;
    --pink-light: #1F2937;
    --bg-card: #374151;
  }
  body.dark-mode .phone { background: var(--bg-main); }
  body.dark-mode .content { background: var(--bg-app); }
  body.dark-mode .form-control { background: var(--bg-card); color: var(--text-main); border-color: #4B5563; }
  body.dark-mode .type-box { background: var(--bg-main); border-color: #4B5563; color: var(--text-muted); }
  body.dark-mode .type-option input[value="income"]:checked ~ .type-box { background: rgba(16, 185, 129, 0.2); border-color: var(--green); color: var(--green); }
  body.dark-mode .type-option input[value="expense"]:checked ~ .type-box { background: rgba(236, 72, 153, 0.2); border-color: var(--pink-dark); color: var(--pink-dark); }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Inter', sans-serif; background: var(--bg-app); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 16px; }
  
  .phone { width: 100%; max-width: 420px; height: 90vh; max-height: 800px; background: var(--bg-main); border-radius: 32px; overflow: hidden; box-shadow: 0 25px 60px -12px rgba(236, 72, 153, 0.25); display: flex; flex-direction: column; position: relative; }

  /* Header Gradasi Pink */
  .app-header { background: linear-gradient(135deg, var(--pink-main) 0%, var(--pink-dark) 100%); padding: 20px; color: white; border-bottom-left-radius: 24px; border-bottom-right-radius: 24px; box-shadow: 0 4px 15px rgba(236, 72, 153, 0.3); z-index: 10; display: flex; align-items: center; gap: 12px; }
  
  .back-btn { background: rgba(255,255,255,0.2); border: none; color: white; width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 21px; cursor: pointer; text-decoration: none; transition: 0.2s; }
  .back-btn:active { transform: scale(0.9); }
  
  .app-title { font-size: 19px; font-weight: 600; }

  /* Area Konten */
  .content { flex: 1; padding: 24px 20px; overflow-y: auto; background: var(--pink-light); }
  
  .form-group { margin-bottom: 24px; }
  
  .form-label { display: block; font-size: 16px; font-weight: 600; color: var(--text-main); margin-bottom: 10px; }
  
  /* Input Umum (Untuk Keterangan) */
  .form-control { width: 100%; padding: 16px; border-radius: 12px; border: 1.5px solid #E5E7EB; font-family: inherit; font-size: 17px; color: var(--text-main); background: white; transition: border-color 0.2s, box-shadow 0.2s; }
  .form-control:focus { outline: none; border-color: var(--pink-main); box-shadow: 0 0 0 3px rgba(236, 72, 153, 0.1); }
  
  /* INPUT NOMINAL */
  #amount {
    font-size: 22px; 
    font-weight: 700; 
    color: var(--pink-dark);
    letter-spacing: 0.5px;
  }
  #amount::placeholder {
    font-size: 18px; 
    font-weight: 400;
    color: #9CA3AF;
  }

  /* Radio Button Type (Pemasukan / Pengeluaran) */
  .type-selector { display: flex; gap: 12px; }
  .type-option { flex: 1; position: relative; cursor: pointer; }
  .type-option input { position: absolute; opacity: 0; cursor: pointer; }
  
  .type-box { display: flex; align-items: center; justify-content: center; gap: 8px; padding: 16px; border-radius: 12px; border: 1.5px solid #E5E7EB; background: white; font-size: 16px; font-weight: 600; color: var(--text-muted); transition: all 0.2s; }
  
  .type-option input[value="income"]:checked ~ .type-box { border-color: var(--green); background: #D1FAE5; color: var(--green); }
  .type-option input[value="expense"]:checked ~ .type-box { border-color: var(--pink-dark); background: #FCE7F3; color: var(--pink-dark); }

  .btn-save { width: 100%; padding: 18px; border-radius: 12px; border: none; background: linear-gradient(135deg, var(--pink-main) 0%, var(--pink-dark) 100%); color: white; font-family: inherit; font-size: 18px; font-weight: 700; cursor: pointer; box-shadow: 0 4px 15px rgba(236, 72, 153, 0.3); transition: transform 0.2s; margin-top: 10px; }
  .btn-save:active { transform: scale(0.98); }
  .btn-save:disabled { opacity: 0.7; cursor: not-allowed; }

  /* CSS ANIMASI SUKSES & CONFETTI */
  .success-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(5px); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 9999; opacity: 0; visibility: hidden; transition: all 0.3s ease; }
  .success-overlay.show { opacity: 1; visibility: visible; }
  .success-icon { width: 80px; height: 80px; border-radius: 50%; background: var(--green); color: white; display: flex; align-items: center; justify-content: center; font-size: 40px; margin-bottom: 16px; box-shadow: 0 10px 25px rgba(16, 185, 129, 0.4); transform: scale(0); animation: popIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
  .success-text { font-size: 18px; font-weight: 700; color: var(--text-main); opacity: 0; animation: fadeInUp 0.5s ease 0.3s forwards; }
  @keyframes popIn { 0% { transform: scale(0); opacity: 0; } 80% { transform: scale(1.1); opacity: 1; } 100% { transform: scale(1); opacity: 1; } }
  @keyframes fadeInUp { 0% { transform: translateY(10px); opacity: 0; } 100% { transform: translateY(0); opacity: 1; } }
  .confetti { position: absolute; width: 10px; height: 10px; background-color: #f00; top: 50%; left: 50%; opacity: 0; z-index: 10000; border-radius: 2px; }
</style>
</head>
<body>

<div class="phone">
  <div class="app-header">
    <a href="index.html" class="back-btn">←</a>
    <div class="app-title">Catat Transaksi</div>
  </div>

  <div class="content">
    <form id="transactionForm">
      <div class="form-group">
        <label class="form-label">Jenis Transaksi</label>
        <div class="type-selector">
          <label class="type-option">
            <input type="radio" name="type" value="income" required>
            <div class="type-box">⬇️ Pemasukan</div>
          </label>
          <label class="type-option">
            <input type="radio" name="type" value="expense" required checked>
            <div class="type-box">⬆️ Pengeluaran</div>
          </label>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">Nominal (Rp)</label>
        <!-- Input diubah menjadi type="text" agar bisa menampung titik, tapi kita set inputmode="numeric" agar keyboard angka muncul -->
        <input type="text" id="amount" class="form-control" placeholder="Contoh: 50.000" required inputmode="numeric">
      </div>

      <div class="form-group">
        <label class="form-label">Keterangan</label>
        <input type="text" id="note" class="form-control" placeholder="Contoh: Beli makan siang" required>
      </div>

      <button type="submit" class="btn-save" id="btnSubmit">Simpan Transaksi</button>
    </form>
  </div>
</div>

<!-- OVERLAY ANIMASI SUKSES -->
<div class="success-overlay" id="successOverlay">
  <div class="success-icon">✓</div>
  <div class="success-text">Transaksi Berhasil Disimpan!</div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
  import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
  import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCk4qgZ5Gu2ZHZ6et0T2MG0-5puy6g10mE",
    authDomain: "keuangan-488ad.firebaseapp.com",
    projectId: "keuangan-488ad",
    storageBucket: "keuangan-488ad.firebasestorage.app",
    messagingSenderId: "229611696652",
    appId: "1:229611696652:web:05b25a6850869de7c93429"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  let currentUser = null;
  const form = document.getElementById('transactionForm');
  const btnSubmit = document.getElementById('btnSubmit');
  const successOverlay = document.getElementById('successOverlay');
  const amountInput = document.getElementById('amount');

  // =====================================================
  // LOGIKA AUTO-FORMAT TITIK RIBUAN
  // =====================================================
  amountInput.addEventListener('input', function(e) {
    // 1. Ambil nilai, hapus semua karakter selain angka
    let rawValue = this.value.replace(/[^0-9]/g, '');
    
    // 2. Jika kosong, biarkan kosong
    if (rawValue === '') {
      this.value = '';
      return;
    }
    
    // 3. Format dengan titik ribuan
    this.value = new Intl.NumberFormat('id-ID').format(rawValue);
  });
  // =====================================================

  function applyTheme() {
    const isDark = localStorage.getItem('darkMode') === 'true';
    if (isDark) { document.body.classList.add('dark-mode'); } else { document.body.classList.remove('dark-mode'); }
  }
  applyTheme();

  onAuthStateChanged(auth, (user) => {
    if (user) { currentUser = user; } else { window.location.href = 'login.html'; }
  });

  function createConfetti() {
    const colors = ['#EC4899', '#10B981', '#FBBF24', '#3B82F6', '#8B5CF6'];
    for (let i = 0; i < 50; i++) {
      const confetti = document.createElement('div');
      confetti.classList.add('confetti');
      confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
      confetti.style.left = '50%'; confetti.style.top = '50%';
      if (Math.random() > 0.5) confetti.style.borderRadius = '50%';
      successOverlay.appendChild(confetti);
      const angle = Math.random() * Math.PI * 2;
      const velocity = 50 + Math.random() * 150;
      const tx = Math.cos(angle) * velocity; const ty = Math.sin(angle) * velocity - 50;
      const animation = confetti.animate([
        { transform: 'translate(-50%, -50%) rotate(0deg)', opacity: 1 },
        { transform: `translate(calc(-50% + ${tx}px), calc(-50% + ${ty}px)) rotate(${Math.random() * 720}deg)`, opacity: 0 }
      ], { duration: 1000 + Math.random() * 1000, easing: 'cubic-bezier(0.25, 1, 0.5, 1)', fill: 'forwards' });
      animation.onfinish = () => confetti.remove();
    }
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault(); 
    if (!currentUser) { alert("Sesi login habis."); window.location.href = 'login.html'; return; }

    const type = document.querySelector('input[name="type"]:checked').value;
    
    // =====================================================
    // PENTING: Ambil angka mentahnya saja (hilangkan titik) sebelum dikirim ke Firebase
    // =====================================================
    const rawAmount = amountInput.value.replace(/\./g, ''); 
    const amount = Number(rawAmount);
    
    const note = document.getElementById('note').value;

    // Validasi tambahan jika nominal kosong atau 0
    if (amount <= 0 || isNaN(amount)) {
      alert("Nominal harus diisi dengan angka yang valid (lebih dari 0).");
      return;
    }

    btnSubmit.disabled = true;
    btnSubmit.innerText = "Menyimpan...";

    try {
      await addDoc(collection(db, "pembukuan"), {
        userId: currentUser.uid, type: type, amount: amount, note: note, createdAt: serverTimestamp()
      });

      successOverlay.classList.add('show'); 
      createConfetti(); 
      
      setTimeout(() => { window.location.href = 'index.html'; }, 2000);

    } catch (error) {
      console.error("Gagal menyimpan: ", error);
      alert("Gagal menyimpan data.");
      btnSubmit.disabled = false;
      btnSubmit.innerText = "Simpan Transaksi";
    }
  });
</script>
</body>
</html>
