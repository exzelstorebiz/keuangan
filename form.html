<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tambah Transaksi</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --pink-main: #EC4899; --pink-dark: #BE185D; --pink-light: #FDF2F8;
    --bg-main: #FFFFFF; --text-main: #1F2937; --text-muted: #6B7280;
    --green: #10B981; --red: #EF4444;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Inter', sans-serif; background: var(--pink-light); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 16px; }
  
  .card { background: white; padding: 24px; border-radius: 24px; box-shadow: 0 10px 25px rgba(236, 72, 153, 0.15); width: 100%; max-width: 360px; }
  
  .header { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
  .back-btn { font-size: 24px; cursor: pointer; color: var(--text-main); }
  h2 { color: var(--pink-dark); font-size: 20px; }

  /* Tipe Transaksi (Toggle) */
  .type-toggle { display: flex; gap: 10px; margin-bottom: 20px; }
  .type-btn { flex: 1; padding: 12px; border-radius: 12px; border: 2px solid var(--pink-light); background: white; font-weight: 600; font-size: 14px; cursor: pointer; color: var(--text-muted); transition: all 0.2s; }
  .type-btn.active-income { background: #D1FAE5; color: var(--green); border-color: var(--green); }
  .type-btn.active-expense { background: #FCE7F3; color: var(--pink-dark); border-color: var(--pink-main); }

  /* Form */
  .form-group { margin-bottom: 16px; }
  .form-label { display: block; font-size: 12px; font-weight: 600; color: var(--text-muted); margin-bottom: 6px; }
  .form-input { width: 100%; padding: 14px; border: 1px solid var(--pink-light); border-radius: 12px; background: var(--pink-light); font-family: inherit; font-size: 15px; color: var(--text-main); outline: none; }
  .form-input:focus { border-color: var(--pink-main); background: white; }

  /* Tombol Simpan */
  .btn-save { width: 100%; padding: 14px; background: linear-gradient(135deg, var(--pink-main), var(--pink-dark)); color: white; border: none; border-radius: 12px; font-weight: 600; font-size: 15px; cursor: pointer; margin-top: 10px; transition: transform 0.2s; }
  .btn-save:active { transform: scale(0.98); }
</style>
</head>
<body>

<div class="card">
  <div class="header">
    <div class="back-btn" onclick="window.location.href='index.html'">‹</div>
    <h2>Tambah Transaksi</h2>
  </div>

  <!-- Pilihan Tipe -->
  <div class="type-toggle">
    <button class="type-btn active-expense" id="btnExpense" onclick="setType('expense')">⬆️ Pengeluaran</button>
    <button class="type-btn" id="btnIncome" onclick="setType('income')">⬇️ Pemasukan</button>
  </div>

  <!-- Form -->
  <div class="form-group">
    <label class="form-label">Nominal (Rp)</label>
    <input type="number" id="inputAmount" class="form-input" placeholder="Contoh: 50000">
  </div>

  <div class="form-group">
    <label class="form-label">Keterangan</label>
    <input type="text" id="inputNote" class="form-input" placeholder="Contoh: Beli sayur">
  </div>

  <button class="btn-save" onclick="simpanTransaksi()">Simpan Transaksi</button>
</div>

<script>
  let currentType = 'expense'; // Default: Pengeluaran

  function setType(type) {
    currentType = type;
    const btnExpense = document.getElementById('btnExpense');
    const btnIncome = document.getElementById('btnIncome');

    if (type === 'expense') {
      btnExpense.className = 'type-btn active-expense';
      btnIncome.className = 'type-btn';
    } else {
      btnExpense.className = 'type-btn';
      btnIncome.className = 'type-btn active-income';
    }
  }

  function simpanTransaksi() {
    const amount = document.getElementById('inputAmount').value;
    const note = document.getElementById('inputNote').value;

    if (!amount || !note) {
      alert("Nominal dan Keterangan wajib diisi!");
      return;
    }

    // Sementara hanya menampilkan alert (nanti kita ganti dengan Firebase)
    alert(`Tipe: ${currentType}\nNominal: Rp ${amount}\nKeterangan: ${note}`);
  }
</script>

</body>
</html>
