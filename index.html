<!DOCTYPE html>
<html lang="id">
<head>
  <script src="https://cdn.jsdelivr.net/npm/eruda"></script>
  <script> eruda.init(); console.log("Eruda Siap!"); </script>
  
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Keuangan Keluarga</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --pink-main: #EC4899; --pink-dark: #BE185D; --pink-light: #FDF2F8;
    --gold: #D4AF37; --gold-light: #FDE68A;
    --bg-main: #FFFFFF; --text-main: #1F2937; --text-muted: #6B7280;
    --green: #10B981; --red: #EF4444;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Inter', sans-serif; background: var(--pink-light); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 16px; }
  
  .phone { width: 100%; max-width: 420px; height: 90vh; max-height: 800px; background: var(--bg-main); border-radius: 32px; overflow: hidden; box-shadow: 0 25px 60px -12px rgba(236, 72, 153, 0.25); display: flex; flex-direction: column; position: relative; }

  .app-header { background: linear-gradient(135deg, var(--pink-main) 0%, var(--pink-dark) 100%); padding: 20px 20px 16px; color: white; border-bottom-left-radius: 24px; border-bottom-right-radius: 24px; box-shadow: 0 4px 15px rgba(236, 72, 153, 0.3); z-index: 10; }
  .header-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  .app-title { font-size: 16px; font-weight: 600; opacity: 0.9; }
  .profile-icon { width: 32px; height: 32px; border-radius: 50%; background: rgba(255,255,255,0.2); display: flex; align-items: center; justify-content: center; font-size: 14px; border: 1.5px solid var(--gold); }

  .balance-card { background: rgba(255, 255, 255, 0.15); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.3); border-radius: 12px; padding: 12px 16px; text-align: center; }
  .balance-label { font-size: 11px; opacity: 0.9; margin-bottom: 2px; display: flex; align-items: center; justify-content: center; gap: 4px; }
  .balance-label span { color: var(--gold-light); font-size: 12px; }
  .balance-amount { font-size: 24px; font-weight: 700; letter-spacing: -0.5px; }
  .balance-amount .currency { font-size: 12px; font-weight: 500; opacity: 0.8; margin-right: 2px; }

  .content { flex: 1; padding: 20px; overflow-y: auto; background: var(--pink-light); }
  
  .section-title { font-size: 14px; font-weight: 700; color: var(--text-main); margin-top: 10px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }
  
  .transaction-list { display: flex; flex-direction: column; gap: 12px; }
  
  .transaction-item { 
    background: white; 
    border-radius: 14px; 
    padding: 16px 16px; 
    display: flex; 
    align-items: center; 
    gap: 14px; 
    box-shadow: 0 2px 6px rgba(0,0,0,0.03); 
    border-left: 4px solid transparent; 
  }
  .transaction-item.income { border-left-color: var(--green); }
  .transaction-item.expense { border-left-color: var(--pink-main); }

  .trx-icon { 
    width: 42px; 
    height: 42px; 
    border-radius: 12px; 
    display: flex; 
    align-items: center; 
    justify-content: center; 
    font-size: 20px; 
  }
  .trx-icon.income { background: #D1FAE5; color: var(--green); }
  .trx-icon.expense { background: #FCE7F3; color: var(--pink-dark); }

  .trx-details { flex: 1; min-width: 0; }
  
  /* --- UKURAN FONT DINAIKKAN 1PX LAGI --- */
  .trx-title { font-size: 15px; font-weight: 600; color: var(--text-main); margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .trx-date { font-size: 12px; color: var(--text-muted); }

  .trx-right { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; flex-shrink: 0; }
  
  .trx-amount { font-size: 15px; font-weight: 700; }
  .trx-amount.income { color: var(--green); }
  .trx-amount.expense { color: var(--text-main); }
  
  /* Tombol edit juga dinaikkan 1px agar seimbang */
  .btn-edit { background: #F3F4F6; border: none; color: var(--text-muted); font-size: 12px; padding: 6px 10px; border-radius: 8px; cursor: pointer; transition: 0.2s; font-weight: 500;}
  .btn-edit:active { background: #E5E7EB; transform: scale(0.95); }

  .empty-state { text-align: center; padding: 30px 10px; color: var(--text-muted); font-size: 13px; }

  .fab { position: absolute; bottom: 20px; right: 20px; width: 56px; height: 56px; border-radius: 50%; background: linear-gradient(135deg, #FBBF24, var(--gold)); border: none; color: white; font-size: 26px; display: flex; align-items: center; justify-content: center; box-shadow: 0 6px 15px rgba(212, 175, 55, 0.4); cursor: pointer; z-index: 30; transition: transform 0.2s; }
  .fab:active { transform: scale(0.9); }
  
  #transactionList { padding-bottom: 80px; } 
</style>
</head>
<body>

<div class="phone">
  <div class="app-header">
    <div class="header-top">
      <div class="app-title">Keuangan Keluarga</div>
      <div class="profile-icon">👩</div>
    </div>
    
    <div class="balance-card">
      <div class="balance-label"><span>✨</span> Total Saldo</div>
      <div class="balance-amount" id="totalBalance"><span class="currency">Rp</span> Memuat...</div>
    </div>
  </div>

  <div class="content">
    <div class="section-title">Transaksi Terakhir</div>
    <div class="transaction-list" id="transactionList">
      <div class="empty-state">Memuat data...</div>
    </div>
  </div>

  <button class="fab" onclick="window.location.href='form.html'">+</button>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
  import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
  import { getFirestore, collection, query, where, orderBy, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCk4qgZ5Gu2ZHZ6et0T2MG0-5puy6g10mE",
    authDomain: "keuangan-488ad.firebaseapp.com",
    projectId: "keuangan-488ad",
    storageBucket: "keuangan-488ad.firebasestorage.app",
    messagingSenderId: "229611696652",
    appId: "1:229611696652:web:05b25a6850869de7c93429"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  const totalBalanceEl = document.getElementById('totalBalance');
  const transactionListEl = document.getElementById('transactionList');

  onAuthStateChanged(auth, (user) => {
    if (user) {
      transactionListEl.innerHTML = '<div class="empty-state">Memuat data...</div>';
      loadTransactions(user.uid);
    } else {
      window.location.href = 'login.html';
    }
  });

  function formatRupiah(angka) {
    return new Intl.NumberFormat('id-ID').format(angka);
  }

  function formatTanggal(timestamp) {
    try {
      if (!timestamp) return "Baru saja";
      const date = timestamp.toDate ? timestamp.toDate() : new Date(timestamp);
      const today = new Date();
      const isToday = date.toDateString() === today.toDateString();
      const time = date.getHours().toString().padStart(2, '0') + ':' + date.getMinutes().toString().padStart(2, '0');
      if (isToday) return `Hari ini, ${time}`;
      const months = ["Jan", "Feb", "Mar", "Apr", "Mei", "Jun", "Jul", "Ags", "Sep", "Okt", "Nov", "Des"];
      return `${date.getDate()} ${months[date.getMonth()]}, ${time}`;
    } catch (e) { return "Waktu tidak valid"; }
  }

  function loadTransactions(userId) {
    const q = query(
      collection(db, "pembukuan"), 
      where("userId", "==", userId),
      orderBy("createdAt", "desc")
    );

    onSnapshot(q, (snapshot) => {
      let totalIncome = 0;
      let totalExpense = 0;
      let html = '';

      if (snapshot.empty) {
        transactionListEl.innerHTML = '<div class="empty-state">Belum ada transaksi. Yuk mulai catat!</div>';
        totalBalanceEl.innerHTML = `<span class="currency">Rp</span> 0`;
        return;
      }

      snapshot.forEach((docSnap) => {
        const data = docSnap.data();
        const docId = docSnap.id;
        const amount = Number(data.amount) || 0;

        if (data.type === 'income') totalIncome += amount;
        else totalExpense += amount;

        const isIncome = data.type === 'income';
        const icon = isIncome ? '💰' : '💸';
        const sign = isIncome ? '+' : '-';
        const typeClass = isIncome ? 'income' : 'expense';
        const noteText = data.note ? data.note : "Tanpa Keterangan";

        html += `
          <div class="transaction-item ${typeClass}">
            <div class="trx-icon ${typeClass}">${icon}</div>
            <div class="trx-details">
              <div class="trx-title">${noteText}</div>
              <div class="trx-date">${formatTanggal(data.createdAt)}</div>
            </div>
            <div class="trx-right">
              <div class="trx-amount ${typeClass}">${sign} Rp ${formatRupiah(amount)}</div>
              <button class="btn-edit" onclick="window.location.href='edit.html?id=${docId}'">✏️ Edit</button>
            </div>
          </div>
        `;
      });

      transactionListEl.innerHTML = html;
      const balance = totalIncome - totalExpense;
      totalBalanceEl.innerHTML = `<span class="currency">Rp</span> ${formatRupiah(balance)}`;
      
    }, (error) => {
      console.error("Firestore Error: ", error);
      transactionListEl.innerHTML = `<div class="empty-state" style="color:var(--red);">Gagal memuat data.</div>`;
    });
  }
</script>
</body>
</html>
