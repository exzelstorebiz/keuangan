<!DOCTYPE html>
<html lang="id">
<head>
  <script src="https://cdn.jsdelivr.net/npm/eruda"></script>
  <script> eruda.init(); console.log("Eruda Siap!"); </script>
  
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profil Saya</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --pink-main: #EC4899; --pink-dark: #BE185D; --pink-light: #FDF2F8;
    --gold: #D4AF37; --bg-main: #FFFFFF; --text-main: #1F2937; --text-muted: #6B7280;
    --green: #10B981; --red: #EF4444;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Inter', sans-serif; background: var(--pink-light); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 16px; }
  
  .phone { width: 100%; max-width: 420px; height: 90vh; max-height: 800px; background: var(--bg-main); border-radius: 32px; overflow: hidden; box-shadow: 0 25px 60px -12px rgba(236, 72, 153, 0.25); display: flex; flex-direction: column; position: relative; }

  .app-header { background: linear-gradient(135deg, var(--pink-main) 0%, var(--pink-dark) 100%); padding: 20px; color: white; border-bottom-left-radius: 24px; border-bottom-right-radius: 24px; box-shadow: 0 4px 15px rgba(236, 72, 153, 0.3); z-index: 10; display: flex; align-items: center; gap: 12px; }
  .back-btn { background: rgba(255,255,255,0.2); border: none; color: white; width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 18px; cursor: pointer; text-decoration: none; transition: 0.2s; }
  .app-title { font-size: 16px; font-weight: 600; }

  .content { flex: 1; padding: 30px 24px; overflow-y: auto; background: var(--pink-light); display: flex; flex-direction: column; align-items: center; }
  
  /* Kartu Profil */
  .profile-card {
    background: white; width: 100%; border-radius: 20px; padding: 30px 20px; text-align: center;
    box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-bottom: 24px;
  }
  .avatar-large {
    width: 80px; height: 80px; border-radius: 50%; background: var(--pink-light); 
    display: flex; align-items: center; justify-content: center; font-size: 40px; 
    margin: 0 auto 16px; border: 2px solid var(--gold);
  }
  .user-email { font-size: 16px; font-weight: 700; color: var(--text-main); margin-bottom: 4px; }
  .user-status { font-size: 12px; color: var(--green); font-weight: 600; background: #D1FAE5; padding: 4px 12px; border-radius: 20px; display: inline-block; }

  /* Tombol Logout */
  .btn-logout {
    width: 100%; padding: 16px; border-radius: 12px; border: none;
    background: #FEF2F2; color: var(--red); font-family: inherit; font-size: 15px; font-weight: 700;
    cursor: pointer; box-shadow: 0 2px 8px rgba(239, 68, 68, 0.1); transition: 0.2s;
    display: flex; align-items: center; justify-content: center; gap: 8px;
  }
  .btn-logout:active { background: #FEE2E2; transform: scale(0.98); }
  
  /* Modal Konfirmasi Logout */
  .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.5); backdrop-filter: blur(2px); display: flex; align-items: center; justify-content: center; z-index: 9999; opacity: 0; visibility: hidden; transition: all 0.3s ease; }
  .modal-overlay.show { opacity: 1; visibility: visible; }
  .modal-box { background: var(--bg-main); width: 85%; max-width: 320px; border-radius: 20px; padding: 24px 20px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.2); transform: translateY(20px) scale(0.95); transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
  .modal-overlay.show .modal-box { transform: translateY(0) scale(1); }
  .modal-icon { width: 60px; height: 60px; background: #FEF2F2; color: var(--red); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 30px; margin: 0 auto 16px; }
  .modal-title { font-size: 16px; font-weight: 700; color: var(--text-main); margin-bottom: 8px; }
  .modal-text { font-size: 13px; color: var(--text-muted); margin-bottom: 20px; line-height: 1.5; }
  .modal-actions { display: flex; gap: 10px; }
  .btn-modal { flex: 1; padding: 12px; border-radius: 10px; border: none; font-family: inherit; font-size: 13px; font-weight: 600; cursor: pointer; transition: 0.2s; }
  .btn-cancel { background: #F3F4F6; color: var(--text-main); }
  .btn-cancel:active { background: #E5E7EB; }
  .btn-confirm { background: linear-gradient(135deg, var(--pink-main) 0%, var(--pink-dark) 100%); color: white; }
  .btn-confirm:active { transform: scale(0.95); }
</style>
</head>
<body>

<div class="phone">
  <div class="app-header">
    <a href="index.html" class="back-btn">←</a>
    <div class="app-title">Profil Saya</div>
  </div>

  <div class="content">
    <div class="profile-card">
      <div class="avatar-large">👩</div>
      <!-- Email akan diisi oleh JavaScript -->
      <div class="user-email" id="userEmail">Memuat...</div>
      <div class="user-status">Aktif</div>
    </div>

    <button class="btn-logout" onclick="bukaModalLogout()">
      🚪 Keluar dari Aplikasi
    </button>
  </div>
</div>

<!-- MODAL KONFIRMASI LOGOUT -->
<div class="modal-overlay" id="logoutModal">
  <div class="modal-box">
    <div class="modal-icon" style="color: var(--pink-dark); background: #FDF2F8;">🚪</div>
    <div class="modal-title">Keluar Aplikasi?</div>
    <div class="modal-text">Anda yakin ingin keluar dari akun ini?</div>
    <div class="modal-actions">
      <button class="btn-modal btn-cancel" onclick="tutupModalLogout()">Batal</button>
      <button class="btn-modal btn-confirm" onclick="prosesLogout()">Ya, Keluar</button>
    </div>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
  import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCk4qgZ5Gu2ZHZ6et0T2MG0-5puy6g10mE",
    authDomain: "keuangan-488ad.firebaseapp.com",
    projectId: "keuangan-488ad",
    storageBucket: "keuangan-488ad.firebasestorage.app",
    messagingSenderId: "229611696652",
    appId: "1:229611696652:web:05b25a6850869de7c93429"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);

  const userEmailEl = document.getElementById('userEmail');
  const logoutModal = document.getElementById('logoutModal');

  // Cek apakah user sudah login
  onAuthStateChanged(auth, (user) => {
    if (user) {
      userEmailEl.textContent = user.email;
    } else {
      // Jika tidak ada user yang login, tendang ke halaman login
      window.location.href = 'login.html';
    }
  });

  // Fungsi Modal Logout
  window.bukaModalLogout = function() {
    logoutModal.classList.add('show');
  }

  window.tutupModalLogout = function() {
    logoutModal.classList.remove('show');
  }

  // Fungsi Eksekusi Logout
  window.prosesLogout = async function() {
    try {
      await signOut(auth);
      // Setelah logout berhasil, arahkan ke halaman login
      window.location.href = 'login.html';
    } catch (error) {
      console.error("Gagal logout: ", error);
      alert("Gagal logout. Cek Eruda.");
    }
  }
</script>
</body>
</html>
